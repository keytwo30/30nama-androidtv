name: Release wgt

# EXPERIMENTAL, manual only (Actions > Release wgt > Run workflow): build tizen-app/ into a .wgt signed with a throwaway author
# certificate generated on the runner, and attach it to a GitHub Release.
# The package is meant to be RE-SIGNED by the user's installer
# (e.g. Apps2Samsung) with their own Samsung certificate, so the throwaway
# cert is discarded after the build. No TMDB token is ever included.

on:
  workflow_dispatch:

permissions:
  contents: write

jobs:
  wgt:
    runs-on: ubuntu-22.04
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Install Tizen Studio CLI
        run: |
          curl -fsSL -o /tmp/web-cli.bin \
            https://download.tizen.org/sdk/Installer/tizen-studio_5.6/web-cli_Tizen_Studio_5.6_ubuntu-64.bin
          chmod +x /tmp/web-cli.bin
          /tmp/web-cli.bin --accept-license "$HOME/tizen-studio" < /dev/null
          echo "$HOME/tizen-studio/tools/ide/bin" >> "$GITHUB_PATH"

      - name: Stage sources (no tools/, no token)
        run: |
          mkdir -p stage/web
          cp -r tizen-app/. stage/web/
          rm -rf stage/web/tools stage/web/js/tmdb-token.js
          VER="${GITHUB_REF_NAME#v}"
          if [[ "$GITHUB_REF_TYPE" == "tag" && "$VER" =~ ^[0-9]+\.[0-9]+\.[0-9]+$ ]]; then
            sed -i -E "s/(<widget [^>]*version=\")[^\"]*(\")/\1${VER}\2/" stage/web/config.xml
          fi
          grep -o 'version="[^"]*"'
